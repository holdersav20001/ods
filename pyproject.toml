[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: fast unit test, no docker stack required",
    "integration: requires docker stack (Postgres, Kafka, SR, S3, etc.)",
    "e2e: full end-to-end pipeline test, slow and stack-heavy",
    "slow: takes >5s; opt-in via -m slow",
    "negative: failure / error / rollback path",
    "requires_spark: needs pyspark importable",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
# Coverage gate spans the four "real code" packages. Top-level
# airflow/dags/*.py DAG files are excluded — they're orchestration glue
# (DAG factory wiring, default_args, schedule cron strings) where unit
# tests have low signal. The reusable helpers under airflow/dags/common
# ARE measured because they're imported and called like normal modules.
source = [
    "ods_pipeline",
    "glue/jobs",
    "services",
    "airflow/dags/common",
]
branch = true
omit = [
    "ods_pipeline/ops/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
# Start small: syntax errors, undefined names, unused imports, sorted imports.
# Tighten over time; promotion is one PR per rule family so the diff stays
# reviewable.
select = ["E9", "F63", "F7", "F82", "F401", "I001"]
# Existing test files use ``from x import *`` patterns and shadow imports;
# silence those for now via per-file ignores rather than blanket-disabling.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "I001"]
"airflow/dags/**" = ["F401"]
