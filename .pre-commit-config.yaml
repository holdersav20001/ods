repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.0.7
    hooks:
      - id: sqlfluff-lint
        files: ^db/migrations/.*\.sql$
        args: [--dialect, postgres]

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.35.1
    hooks:
      - id: yamllint
        files: \.(yml|yaml)$

  - repo: local
    hooks:
      - id: validate-avro-schemas
        name: validate avro schemas
        entry: python scripts/validate_avro_schemas.py
        language: system
        files: ^schemas/.*\.avsc$
        pass_filenames: false
