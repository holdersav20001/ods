name: integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "airflow/**"
      - "db/**"
      - "docker/**"
      - "glue/**"
      - "ods_pipeline/**"
      - "schemas/**"
      - "services/**"
      - "tests/integration/**"
      - "docker-compose.yml"

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Start local stack
        run: docker compose up -d --build

      - name: Wait for Airflow DAG imports
        run: |
          for i in {1..40}; do
            if docker compose exec -T airflow-scheduler airflow dags list-import-errors | grep -q "No data found"; then
              exit 0
            fi
            sleep 10
          done
          docker compose exec -T airflow-scheduler airflow dags list-import-errors
          exit 1

      - name: Run focused integrations
        run: |
          python -m pytest \
            tests/integration/test_event_api_live.py \
            tests/integration/test_replay_cli_live.py \
            tests/integration/test_dual_sink_parity_live.py \
            tests/integration/test_publish.py \
            tests/integration/test_canonical_pipeline.py \
            -q

      - name: Collect docker logs
        if: failure()
        run: docker compose logs --no-color > docker-compose-failure.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docker-compose-failure-log
          path: docker-compose-failure.log
