name: unit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # ruff config in pyproject.toml — explicit minimal rule set so the
      # baseline is green on day one. Promotion is one rule family per PR.
      # `ruff format --check` is intentionally NOT in CI yet: existing
      # files are formatted by black via pre-commit; once everything is
      # converted to ruff format the check can be added.
      - name: ruff check
        run: ruff check .

  unit:
    runs-on: ubuntu-latest
    # Postgres sidecar matches the local stack (host 127.0.0.1:5440 → 5432).
    # Many tests under tests/unit hit pipeline.* via the pg_conn fixture and
    # cannot run without a live DB. The unit job applies all migrations
    # before pytest so the schema matches what callers expect.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ods_dev
          POSTGRES_USER: ods
          POSTGRES_PASSWORD: ods
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U ods -d ods_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_PG_HOST: 127.0.0.1
      TEST_PG_PORT: "5440"
      TEST_PG_DB: ods_dev
      TEST_PG_USER: ods
      TEST_PG_PASSWORD: ods
      PIPELINE_PG_DSN: "host=127.0.0.1 port=5440 dbname=ods_dev user=ods password=ods"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply all migrations
        env:
          PGPASSWORD: ods
        run: |
          for f in $(ls db/migrations/*.sql | sort); do
            echo "==> applying $f"
            psql -h 127.0.0.1 -p 5440 -U ods -d ods_dev -v ON_ERROR_STOP=1 -f "$f"
          done

      # Two coverage gates, both run on every PR.
      #
      # 1) ods_pipeline FLOOR — pinned at 70%. This is the original
      #    high-bar gate; a regression in the core control-plane
      #    package fails CI immediately, regardless of what happens to
      #    auxiliary packages. Without this floor, the broader combined
      #    gate (below) would silently absorb an ods_pipeline drop.
      - name: ods_pipeline coverage floor (>=70%)
        run: |
          python -m pytest tests/unit -q \
            --cov=ods_pipeline \
            --cov-report=term \
            --cov-fail-under=70

      # 2) Combined coverage gate — broader scope (glue/jobs, services,
      #    airflow/dags/common). Threshold is the combined baseline
      #    measured at gate-introduction minus slack so CI is green day
      #    one. Catches silent dead-branches in packages that previously
      #    had zero coverage measurement at all.
      - name: Run unit tests with combined coverage
        run: |
          python -m pytest tests/unit -q \
            --cov=ods_pipeline \
            --cov=glue/jobs \
            --cov=services \
            --cov=airflow/dags/common \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=40

      - name: Per-package coverage summary
        if: always()
        run: python scripts/coverage_per_package_summary.py coverage.xml

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Validate Avro schemas
        run: python scripts/validate_avro_schemas.py

      - name: Validate dataset configs
        run: |
          python -c "
          import glob, sys, yaml
          from ods_pipeline.config import validate_dataset_config, DatasetConfigError
          fails = []
          paths = glob.glob('patterns/**/*.yaml', recursive=True) + glob.glob('datasets/**/*.yaml', recursive=True)
          for path in paths:
              with open(path) as f:
                  cfg = yaml.safe_load(f)
              if not isinstance(cfg, dict):
                  continue
              if 'source_type' not in cfg and 'target_topic' not in cfg and 'delivery' not in cfg:
                  continue
              if 'domain' not in cfg or 'dataset' not in cfg:
                  continue
              try:
                  validate_dataset_config(cfg)
              except DatasetConfigError as e:
                  fails.append((path, str(e)))
          for p, m in fails:
              print(f'FAIL {p}: {m}')
          if fails:
              sys.exit(1)
          print(f'all {len(paths)} yamls checked, no validator failures')
          "
