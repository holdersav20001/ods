domain: insurance
dataset: insurance_policy_history
source_type: s3_batch
write_mode: append
filename_pattern: '^policies_(?P<bd>\d{8})\.csv$'
key_fields: []
target_topic: ods.insurance.policy_history
postgres_target_table: ods.insurance_policy_history
s3_curated_path: s3://ods-curated/insurance/policy_history/
schema_def:
  fields:
    - {name: policy_id,      type: string,          nullable: false, source_name: policy_id}
    - {name: status,         type: string,          nullable: false, source_name: status}
    - {name: premium,        type: 'decimal(10,2)', nullable: true,  source_name: premium}
    - {name: effective_date, type: date,            nullable: true,  source_name: effective_date}
dq_rules:
  hard:
    - {rule: not_null, column: policy_id}
  soft:
    - {rule: completeness_pct, column: premium, min_pct: 95}
recon_tolerance_records: 0
recon_tolerance_pct: 0
