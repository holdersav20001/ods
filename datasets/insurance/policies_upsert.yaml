domain: insurance
dataset: policies_upsert
source_type: s3_batch
write_mode: upsert
filename_pattern: '^policies_upsert_(?P<bd>\d{8})\.csv$'
key_fields: [policy_id]
target_topic: ods.insurance.policies_upsert
postgres_target_table: ods.policies_upsert
s3_curated_path: s3://ods-curated-local/insurance/policies_upsert/
schema_def:
  fields:
    - {name: policy_id,      type: string,          nullable: false}
    - {name: status,         type: string,          nullable: false}
    - {name: premium,        type: 'decimal(10,2)', nullable: true}
    - {name: effective_date, type: date,            nullable: true}
dq_rules:
  hard:
    - {rule: not_null, column: policy_id}
    - {rule: unique,   column: policy_id}
  soft: []
recon_tolerance_records: 0
recon_tolerance_pct: 0
