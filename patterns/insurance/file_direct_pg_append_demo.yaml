# File → direct-Postgres demo (append).
#
# Append-only audit history table. No PK on target; every run inserts
# a new batch tagged by _ods_run_id. No Kafka leg.
domain: insurance
dataset: file_direct_pg_append_demo
source_type: s3_batch
delivery: direct_postgres
filename_pattern: '^events_(?P<bd>\d{8})\.csv$'
raw_format: csv
is_canonical: true
write_mode: append
key_fields: [event_id]
schema_id: ods.insurance.file_direct_pg_append_demo-value
schema_version: 1
postgres_target_table: ods.insurance_file_direct_pg_append_demo
s3_curated_path: s3://ods-curated-local/insurance/file_direct_pg_append_demo/
data_classification: Internal
recon_tolerance_records: 0
recon_tolerance_pct: 0
schema_def:
  fields:
    - {name: event_id, type: string}
    - {name: payload, type: string}
dq_rules:
  hard_blocks: []
  soft_warns: []
