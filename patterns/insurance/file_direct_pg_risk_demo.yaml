# File -> direct-Postgres demo (NON-CANONICAL, append).
#
# Source delivers risk rows with source-shape column names (RskID,
# PolNo, ExposureAmt, AsOfDt). The curated parquet retains the
# source-shape names (DQ runs against incoming data), and
# ods_postgres_write.py runs the inline canonicalize transform
# before writing canonical-shape columns (risk_id, policy_id,
# exposure_amount, as_of_date) into the target table.
#
# Append-only audit history table. No PK on target; every run inserts
# a new batch tagged by _ods_run_id. No Kafka leg.
domain: insurance
dataset: file_direct_pg_risk_demo
source_type: s3_batch
delivery: direct_postgres
filename_pattern: '^risk_directpg_(?P<bd>\d{8})\.csv$'
raw_format: csv
is_canonical: false
write_mode: append
key_fields: [risk_id, as_of_date]
schema_id: ods.insurance.file_direct_pg_risk_demo-value
schema_version: 1
postgres_target_table: ods.insurance_file_direct_pg_risk_demo
transform_yaml_path: /home/glue_user/workspace/jobs/patterns/insurance/file_direct_pg_risk_demo.yaml
s3_curated_path: s3://ods-curated-local/insurance/file_direct_pg_risk_demo/
data_classification: Internal
recon_tolerance_records: 0
recon_tolerance_pct: 0
schema_def:
  fields:
    - {name: RskID, type: string}
    - {name: PolNo, type: string}
    - {name: ExposureAmt, type: double}
    - {name: AsOfDt, type: string}
dq_rules:
  hard_blocks:
    - {field: RskID, rule: not_null}
  soft_warns: []
transform:
  fields:
    - {source: RskID, target: risk_id, type: string, required: true}
    - {source: PolNo, target: policy_id, type: string, required: true}
    - {source: ExposureAmt, target: exposure_amount, type: double}
    - {source: AsOfDt, target: as_of_date, type: date, format: yyyyMMdd, required: true}
  required: [risk_id, policy_id, as_of_date]
