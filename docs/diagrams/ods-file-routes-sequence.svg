<svg xmlns="http://www.w3.org/2000/svg" width="1570" height="1060" viewBox="0 0 1570 1060"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><line x1="115" y1="255" x2="305" y2="255" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="210" y="249" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155" text-anchor="middle"><tspan>drop file in /upload</tspan></text><line x1="305" y1="300" x2="495" y2="300" stroke="#D97706" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="294" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#D97706" text-anchor="middle"><tspan>query active s3_batch configs by delivery</tspan></text><line x1="305" y1="345" x2="115" y2="345" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="210" y="339" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155" text-anchor="middle"><tspan>match filename_pattern, hash bytes</tspan></text><line x1="305" y1="390" x2="685" y2="390" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="495" y="384" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155" text-anchor="middle"><tspan>put raw object</tspan></text><line x1="305" y1="435" x2="495" y2="435" stroke="#D97706" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="429" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#D97706" text-anchor="middle"><tspan>insert file_catalogue(state=received)</tspan></text><line x1="305" y1="545" x2="875" y2="545" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/><text x="590" y="539" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2563EB" text-anchor="middle"><tspan>trigger dag_ingest(conf=file_id, domain, dataset, business_date)</tspan></text><line x1="875" y1="590" x2="495" y2="590" stroke="#D97706" stroke-width="2" marker-end="url(#arrow)"/><text x="685" y="584" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#D97706" text-anchor="middle"><tspan>init_run: create s3_batch parent + ingestion + publish + optional canonicalize runs</tspan></text><line x1="875" y1="635" x2="1065" y2="635" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/><text x="970" y="629" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2563EB" text-anchor="middle"><tspan>spark-submit ods_ingestion.py</tspan></text><line x1="1065" y1="680" x2="685" y2="680" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="875" y="674" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155" text-anchor="middle"><tspan>read raw, write curated, DLQ failures, t0_ingestion_count</tspan></text><line x1="875" y1="725" x2="1065" y2="725" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/><text x="970" y="719" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2563EB" text-anchor="middle"><tspan>spark-submit ods_s3_publish.py</tspan></text><line x1="1065" y1="770" x2="1255" y2="770" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/><text x="1160" y="764" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2563EB" text-anchor="middle"><tspan>publish Avro, write t0_publish_count</tspan></text><line x1="1255" y1="815" x2="1445" y2="815" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/><text x="1350" y="809" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2563EB" text-anchor="middle"><tspan>Connect sinks consume target/canonical topic</tspan></text><line x1="875" y1="860" x2="495" y2="860" stroke="#D97706" stroke-width="2" marker-end="url(#arrow)"/><text x="685" y="854" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#D97706" text-anchor="middle"><tspan>wait_sinks observes offsets; finalise closes run statuses</tspan></text><