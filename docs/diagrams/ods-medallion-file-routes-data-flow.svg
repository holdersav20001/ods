<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="925" viewBox="0 0 1580 925"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><line x1="195" y1="260" x2="540" y2="260" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="367.5" y="254" font-family="Arial" font-size="12" fill="#64748B" text-anchor="middle">canonical route</text><line x1="195" y1="430" x2="540" y2="435" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="367.5" y="426.5" font-family="Arial" font-size="12" fill="#64748B" text-anchor="middle">non-canonical route</text><line x1="195" y1="260" x2="195" y2="635" stroke="#EA580C" stroke-width="2" marker-end="url(#arrow)"/><line x1="195" y1="430" x2="195" y2="635" stroke="#EA580C" stroke-width="2" marker-end="url(#arrow)"/><line x1="540" y1="260" x2="705" y2="640" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><line x1="540" y1="435" x2="705" y2="640" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><line x1="705" y1="640" x2="1110" y2="272.5" stroke="#D97706" stroke-width="2" marker-end="url(#arrow)"/><text x="907.5" y="450.25" font-family="Arial" font-size="12" fill="#D97706" text-anchor="middle">append full canonical history</text><line x1="1110" y1="272.5" x2="1110" y2="450" stroke="#D97706" stroke-width="2" marker-end="url(#arrow)"/><text x="1110" y="355.25" font-family="Arial" font-size="12" fill="#D97706" text-anchor="middle">derive latest per key</text><line x1="1110" y1="450" x2="1110" y2="637.5" stroke="#16A34A" stroke-width="3" marker-end="url(#arrow)"/><text x="1110" y="537.75" font-family="Arial" font-size="12" fill="#16A34A" text-anchor="middle">merge/upsert latest only</text><line x1="705" y1="640" x2="805" y2="832.5" stroke="#D97706" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#arrow)"/><line x1="1110" y1="637.5" x2="805" y2="832.5" stroke="#D97706" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#111827" text-anchor="middle"><tspan x="380" y="51.5">File Routes - Medallion Data Flow</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="517" y="80.5">Canonical and non-canonical files converge into silver canonical data before gold history/current projections.</tspan></text><rect x="80" y="130" width="230" height="45" rx="8" fill="#FED7AA" stroke="#EA580C" stroke-width="1"/><text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle"><tspan x="195" y="159">RAW / BRONZE</tspan></text><rect x="575" y="130" width="230" height="45" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/><text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle"><tspan x="690" y="159">SILVER</tspan></text><rect x="1060" y="130" width="230" height="45" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/><text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle"><tspan x="1175" y="159">GOLD</tspan></text><path d="M80,220 H292 L310,238 V300 H80 Z" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/><path d="M292,220 V238 H310" fill="none" stroke="#64748B"/><text font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle"><tspan x="195" y="249.5">Canonical file</tspan><tspan x="195" y="264.5">source columns already match</tspan><tspan x="195" y="279.5">contract</tspan></text><path d="M80,390 H292 L310,408 V470 H80 Z" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/><path d="M292,390 V408 H310" fill="none" stroke="#64748B"/><text font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle"><tspan x="195" y="419.5">Non-canonical file</tspan><tspan x="195" y="434.5">source-specific names and</tspan><tspan x="195" y="449.5">formats</tspan></text><rect x="80" y="593" width="230" height="84" fill="#FED7AA" stroke="#EA580C" stroke-width="1"/><ellipse cx="195" cy="593" rx="115" ry="8" fill="#FED7AA" stroke="#EA580C" stroke-width="1"/><path d="M80,677 C80,688 310,688 310,677" fill="none" stroke="#EA580C" stroke-width="1"/><text font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle"><tspan x="195" y="624.5">S3 raw</tspan><tspan x="195" y="639.5">original bytes retained exactly</tspan><tspan x="195" y="654.5">file_id + md5 + business_date</tspan></text><rect x="420" y="220" width="240" height="80" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1"/><text font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="middle"><tspan x="540" y="249.5">Identity standardization</tspan><tspan x="540" y="264.5">add ODS metadata</tspan><tspan x="540" y="279.5">schema + DQ</tspan></text><rect x="420" y="390" width="240" height="90" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1"/><text font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle"><tspan x="540" y="424.5">Transformation mapping</tspan><tspan x="540" y="439.5">transform.yaml</tspan><tspan x="540" y="454.5">rename, cast, derive, require</tspan></text><rect x="575" y="593" width="260" height="94" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/><ellipse cx="705" cy="593" rx="130" ry="8" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/><path d="M575,687 C575,698 835,698 835,687" fill="none" stroke="#64748B" stroke-width="1"/><text font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle"><tspan x="705" y="622">S3 silver canonical Parquet</tspan><tspan x="705" y="637">append-only technical history</tspan><tspan x="705" y="652">_ods_file_id, _ods_run_id,</tspan><tspan x="705" y="667">_ods_ingested_at</tspan></text><rect x="980" y="228" width="260" height="89" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/><ellipse cx="1110" cy="228" rx="130" ry="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/><path d="M980,317 C980,328 1240,328 1240,317" fill="none" stroke="#D97706" stroke-width="1"/><text font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle"><tspan x="1110" y="254.5">S3 gold history</tspan><tspan x="1110" y="269.5">all canonical versions</tspan><tspan x="1110" y="284.5">partitioned for replay, audit and</tspan><tspan x="1110" y="299.5">rebuild</tspan></text><rect x="980" y="405" width="260" height="90" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/><text font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle"><tspan x="1110" y="439.5">Gold current projection</tspan><tspan x="1110" y="454.5">one latest row per key</tspan><tspan x="1110" y="469.5">merge rules from contract.key_fields</tspan></text><rect x="980" y="593" width="260" height="89" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/><ellipse cx="1110" cy="593" rx="130" ry="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/><path d="M980,682 C980,693 1240,693 1240,682" fill="none" stroke="#16A34A" stroke-width="1"/><text font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle"><tspan x="1110" y="627">Postgres current serving table</tspan><tspan x="1110" y="642">latest merged data only</tspan><tspan x="1110" y="657">no full history burden</tspan></text><rect x="1320" y="585" width="210" height="105" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/><text font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="1425" y="612">If consumers need history in</tspan><tspan x="1425" y="627">SQL, expose a separate</tspan><tspan x="1425" y="642">history table or query</tspan><tspan x="1425" y="657">S3/Athena. Do not overload</tspan><tspan x="1425" y="672">the current table.</tspan></text><path d="M90,790 H1530 V875 H90 C75,875 75,790 90,790 Z" fill="#FFFBEB" stroke="#D97706" stroke-width="1"/><path d="M90,790 C105,798 105,867 90,875" fill="none" stroke="#D97706" stroke-width="1"/><text font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle"><tspan x="805" y="829.5">Control plane evidence</tspan><tspan x="805" y="844.5">dataset_config declares route and keys; reconciliation proves counts at raw to silver, silver to gold, and gold current to Postgres</tspan></text></svg>